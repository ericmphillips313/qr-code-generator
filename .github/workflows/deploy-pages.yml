name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - gh-pages-deploy

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          # directory produced by adapter-static per our svelte.config.js
          publish_dir: ./build
          publish_branch: gh-pages
          # Use the provided GITHUB_TOKEN so no extra secret needed
          github_token: ${{ secrets.GITHUB_TOKEN }}
